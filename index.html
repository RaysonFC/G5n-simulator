<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZOOM G5n · Patch Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">ZOOM <span>G5n</span> · PATCH LAB</div>
    <div class="patch-name-area">
      <div class="patch-num" id="currentPatchNum">001</div>
      <input class="patch-name-input" id="patchNameInput" type="text" placeholder="PATCH NAME" maxlength="16" autocomplete="off" spellcheck="false" />
    </div>
    <div class="guitar-badge">
      <strong>STRATO SEVEN SGT-207 NT</strong>
      BASSWOOD · SINGLE-COIL · 6 CORDAS
    </div>
  </header>

  <!-- Banco de patches em carrossel (acima da cadeia) -->
  <section class="patch-bank">
    <div class="patch-bank-header">
      <div class="section-title">▌ BANCO DE PATCHES</div>
      <div class="patch-carousel-hint">← deslize →</div>
    </div>
    <div class="patch-list" id="patchList"></div>
  </section>

  <section class="hw-panel">
    <div class="overview-bar">
      <div class="overview-label">OVERVIEW</div>
      <div class="overview-chain" id="overviewChain"></div>
      <div class="overview-nav">
        <button class="ov-nav-btn" id="unitPagePrev" onclick="shiftUnitPage(-1)">◀</button>
        <span class="ov-page" id="unitPageLabel">1/1</span>
        <button class="ov-nav-btn" id="unitPageNext" onclick="shiftUnitPage(1)">▶</button>
      </div>
    </div>
    <div class="units-row">
      <div class="units-grid" id="unitsGrid"></div>
      <div class="exp-pedal" title="Pedal de expressão">
        <div class="exp-pedal-body">
          <div class="exp-pedal-surface"></div>
          <div class="exp-pedal-label">PEDAL</div>
        </div>
        <div class="exp-pedal-base"></div>
      </div>
    </div>
    <div class="fs-row" id="fsRow"></div>
  </section>

  <div class="controls-row">
    <button class="btn primary" onclick="addSlot()">+ ADD EFEITO</button>
    <button class="btn" onclick="clearChain()">LIMPAR</button>
    <button class="btn" onclick="savePatch()">SALVAR PATCH</button>
    <button class="btn danger" onclick="deleteCurrentPatch()">EXCLUIR</button>
    <div class="slot-counter">
      <span class="slot-counter-label">SLOTS:</span>
      <span class="slot-counter-val" id="slotCount">0/9</span>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <div class="modal-title">SELECIONAR EFEITO</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-search">
        <input type="search" id="fxSearch" class="fx-search-input" placeholder="Buscar efeito..." autocomplete="off" oninput="onFxSearch(this.value)" />
      </div>
      <div class="modal-cats" id="modalCats"></div>
      <div class="fx-grid" id="fxGrid"></div>
    </div>
  </div>

  <script src="fx-database.js"></script>
  <script src="patches.js"></script>
  <script src="app.js"></script>
</body>
</html>
